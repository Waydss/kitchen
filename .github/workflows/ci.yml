name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, unit tests, and static analysis
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

      - name: Scan Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start the complete stack
        run: docker compose up -d --build --wait

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://kitchen:kitchen@localhost:55432/kitchen?sslmode=disable
        run: go test -tags=integration ./... -count=1

      - name: Run end-to-end tests
        env:
          E2E_API_URL: http://localhost:8080
        run: go test -tags=e2e ./tests/e2e -count=1

      - name: Run public API smoke test
        env:
          API_URL: http://localhost:8080
        run: ./scripts/smoke.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
